<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-4">
<!-- Login Card -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-lg shadow-[0px_4px_20px_rgba(0,0,0,0.05)] p-container-margin md:p-[32px] sm:p-gutter flex flex-col gap-stack-lg">
<!-- Header -->
<header class="text-center flex flex-col items-center gap-stack-sm">
<div class="w-12 h-12 bg-primary-container rounded-full flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-on-primary" style="font-size: 28px;">admin_panel_settings</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">Nexus Society</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to access your administrative portal.</p>
</header>
<!-- Form -->
<form class="flex flex-col gap-stack-md mt-4">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-outline-variant">mail</span>
<input class="w-full pl-10 pr-4 py-2 border border-outline-variant rounded-DEFAULT focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all font-body-sm text-body-sm text-on-surface bg-surface-container-lowest" id="email" name="email" placeholder="admin@nexus.society" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary-container hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-outline-variant">lock</span>
<input class="w-full pl-10 pr-10 py-2 border border-outline-variant rounded-DEFAULT focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all font-body-sm text-body-sm text-on-surface bg-surface-container-lowest" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 transform -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-2 bg-primary-container text-on-primary py-3 px-4 rounded-DEFAULT font-label-md text-label-md hover:bg-primary transition-colors flex items-center justify-center gap-2 shadow-sm" type="submit">
                Sign In
                <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-2">
<div class="flex-1 h-px bg-outline-variant/50"></div>
<span class="font-label-sm text-label-sm text-outline">or continue with</span>
<div class="flex-1 h-px bg-outline-variant/50"></div>
</div>
<!-- Social Login -->
<div class="flex flex-col gap-3">
<button class="w-full flex items-center justify-center gap-3 py-2 px-4 border border-outline-variant rounded-DEFAULT bg-surface-container-lowest hover:bg-surface-container-low transition-colors font-label-md text-label-md text-on-surface" type="button">
<img alt="Google" class="w-5 h-5 object-contain" data-alt="A clean, minimalist 2D illustration of a generic colorful abstract geometric logo resembling a 'G', rendered in flat, vector style against a pure white background. The image should be highly simplified, suitable for a UI icon, using vibrant red, blue, yellow, and green hues." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDHcoCb8ZMc36UtX-peP3A4LrGPFM7jTAaWyoh9RmaoagKDPdEaMtiNW4aqVHtCS1D4asJNMG4EnzZVPFSj3grXcf2nmw0M4GUiXB5O-8kLoEhaK5cQT6dbatRSs50SAlk85rVZJpoEkz58rlq_h7pyoDdRJjyfMKbpM_dUehbs7SdrnTKrt3cKgiIBSDZAYH38mMAWgIS9Ffz4YJoqYpj-h0NDkA09ZZoJf82jvtzbXG4829m9pBW8ng"/>
                Google
            </button>
<button class="w-full flex items-center justify-center gap-3 py-2 px-4 border border-outline-variant rounded-DEFAULT bg-surface-container-lowest hover:bg-surface-container-low transition-colors font-label-md text-label-md text-on-surface" type="button">
<img alt="Apple" class="w-5 h-5 object-contain" data-alt="A sleek, minimalist 2D vector silhouette of an apple with a bite taken out of it, rendered in solid black against a pure white background. The icon should be perfectly smooth and geometric, typical of high-end tech branding UI elements." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAZgCHJQZkGrRbP-9gD93EbyTKmaA7cRH7ErczdG40VuV0F5P8E3hvg0gnaYYbPpcvZwXknWCMxqXay-B8S4SVmVs32T0ItWNdDrRWOLcQT2hcoy010MolGBuUD8_3wHdO5A2TDzCZ1hK8j5ec8YoXEblNqCZ4Bs__XNQUOuIRROS-mygiCxiIJfGv8Vf5EkCjNG7lxfSwrMUB_62ccJlxeTquXS5RgbVVwnOVaLK9lCuCvJF57gMhDqQ"/>
                Apple
            </button>
</div>

<p class="mt-4 text-center font-body-sm text-body-sm text-on-surface-variant">
            By signing in, you agree to our <a class="text-primary-container hover:underline" href="#">Terms of Service</a> and <a class="text-primary-container hover:underline" href="#">Privacy Policy</a>.
        </p>
