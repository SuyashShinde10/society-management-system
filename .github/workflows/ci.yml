name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-audit:
    name: 🔒 Security & Secrets Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-quality-gate:
    name: ⚙️ Backend (TypeScript, Tests, Migrations)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Build & Strict Typecheck Gate
        run: npm run build

      - name: Run Test Suites (18 Suites / 77 Tests)
        run: npm test -- --runInBand --verbose
        env:
          MONGO_URI: "mongodb://127.0.0.1:27017/ci_test_db"
          JWT_SECRET: "ci_jwt_super_secret_test_key_12345"
          JWT_REFRESH_SECRET: "ci_jwt_refresh_super_secret_test_key_12345"
          ADMIN_SECRET: "ci_admin_super_secret_key_12345"
          NODE_ENV: "test"
          CI: "true"

  frontend-quality-gate:
    name: 🌐 Frontend (Build & Playwright E2E)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Production Bundle & PWA Service Worker Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Browser Automation
        run: npm run test:e2e
        env:
          PLAYWRIGHT_TEST_BASE_URL: "http://localhost:4173"
