name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-audit:
    name: 🔒 Security & Secrets Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-quality-gate:
    name: ⚙️ Backend (TypeScript, Tests, Migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Typecheck Gate
        run: npx tsc --noEmit

      - name: Run Test Suites (14 Suites / 52 Tests)
        run: npm test
        env:
          JWT_SECRET: "ci_jwt_super_secret_test_key_12345"
          NODE_ENV: "test"

  frontend-quality-gate:
    name: 🌐 Frontend (Build & Playwright E2E)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Production Bundle & PWA Service Worker Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Browser Automation
        run: npm run test:e2e
        env:
          PLAYWRIGHT_TEST_BASE_URL: "http://localhost:4173"
